name: Build and publish to Latest release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-latest-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify release publishing logic
        run: python3 -m unittest discover -s tests -p test_publish_latest.py -v

      - name: Set up Java 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install Android build tools
        run: |
          sdkmanager="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          (yes || true) | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.1.12297006' \
            'cmake;3.22.1'

      - name: Build ARM64 and x86_64 release ZIP
        run: |
          # The recovered release has versionCode 18; CI builds start at 19.
          bash ./gradlew --no-daemon --console=plain :module:zipRelease \
            "-PreleaseVersionCode=$((18 + GITHUB_RUN_NUMBER))" \
            "-PreleaseCommitHash=${GITHUB_SHA:0:7}"

      - name: Verify shell context handling
        run: |
          python3 -m venv "$RUNNER_TEMP/auditpatch-tests"
          "$RUNNER_TEMP/auditpatch-tests/bin/python" -m pip install --disable-pip-version-check -r tests/requirements.txt
          "$RUNNER_TEMP/auditpatch-tests/bin/python" -m unittest discover -s tests -p test_shell_context.py -v

      - name: Prepare release assets
        id: package
        run: |
          shopt -s nullglob
          archives=(module/release/*-release.zip)
          if (( ${#archives[@]} != 1 )); then
            echo 'Expected exactly one release ZIP.' >&2
            exit 1
          fi
          unzip -t "${archives[0]}"
          mkdir -p dist
          cp "${archives[0]}" dist/ZN-AuditPatch-release.zip
          (
            cd dist
            sha256sum ZN-AuditPatch-release.zip > ZN-AuditPatch-release.zip.sha256
          )
          version=$(sed -n 's/^version=\([^ ]*\).*/\1/p' module/build/outputs/module/release/module.prop)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Save build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auditpatch-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload to the current Latest release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: bash .github/scripts/publish-latest.sh dist/ZN-AuditPatch-release.zip "$RELEASE_VERSION"
